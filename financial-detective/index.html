<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182b"><title>Financial Detective</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1425;color:#f0f4ff;font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}header{background:#182540;padding:18px 16px;border-bottom:1px solid #354666}main{max-width:760px;margin:auto;padding:18px 15px 80px}.card{background:#192640;border:1px solid #3c5275;border-radius:16px;padding:19px;margin:15px 0}h1{font-size:25px;margin:0}h2{font-size:22px;margin:4px 0 12px}h3{margin:14px 0 8px}p{margin:10px 0}small,.muted{color:#b6c7e3}button{display:block;width:100%;min-height:52px;margin:10px 0;padding:12px;border:1px solid #6684af;background:#263c60;color:white;border-radius:12px;text-align:left;font:inherit;cursor:pointer}button.primary{background:#2866d6;border-color:#5d97ff;text-align:center;font-weight:700}button:disabled{opacity:.55}button.correct{background:#185f49}button.wrong{background:#713543}.bar{height:12px;background:#334564;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#61d8ae;transition:width .2s}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:120px;text-align:center}.tag{display:inline-block;padding:3px 9px;border-radius:12px;background:#314568;font-size:13px}input,textarea{width:100%;background:#0e192e;color:white;border:1px solid #7088a9;border-radius:10px;padding:12px;font:inherit}textarea{min-height:130px}#status{color:#80e7b5;font-weight:600}footer{color:#aab9d2;font-size:12px;text-align:center;padding:18px}</style></head><body><header><h1>🕵️ Financial Detective</h1><small>Investigate the full story behind a company</small></header><main><div class="card"><div class="row"><span class="tag" id="rank">Rookie Analyst</span><span class="tag" id="xp">0 XP</span><span class="tag" id="count">0 / 12 missions</span></div><p class="muted">Academy progress</p><div class="bar"><div id="progress"></div></div></div><div id="app"></div><div class="row"><button onclick="home()">🏠 Academy</button><button onclick="caseFile()">📂 Case file</button><button onclick="notes()">📝 Journal</button></div><footer>Fictional financial data for education. Progress is stored on this device in this browser.</footer></main><script>
const missions=[
["Business Model","Revenue isn't the same as value creation. Investigate customers, pricing, demand, segments and economic incentives.","A company reports revenue up 24%, including a newly acquired subsidiary. What do you investigate first?",["Organic growth excluding acquisitions","Its new office furniture","The CEO's favorite stock"],0,"Acquisitions can increase reported sales without improving underlying demand."],
["Income Statement","Trace revenue, COGS, gross profit, operating expenses, taxes and net income. Compare margins over time.","Revenue is $1,000M and COGS is $620M. What is gross margin?",["62%","38%","$620M"],1,"Gross margin = (1,000 − 620) / 1,000 = 38%."],
["Balance Sheet","Reconcile assets = liabilities + equity. Investigate liquidity, receivables, inventory, debt and obligations.","Assets are $1,500M and liabilities are $900M. Equity equals:",["$2,400M","$900M","$600M"],2,"Equity is the residual: $1,500M − $900M = $600M."],
["Cash Flow","Separate operating, investing and financing cash flow. Look for working-capital distortions and capital intensity.","Operating cash flow is $210M; CapEx is $60M. Free cash flow is:",["$150M","$270M","$60M"],0,"Free cash flow (simple definition) = operating cash flow − capital expenditures."],
["Profitability and ROIC","Compare ROIC to the cost of capital. Use average invested capital and normalize unusual income.","NOPAT is $120M and average invested capital is $800M. ROIC is:",["8%","15%","25%"],1,"ROIC = 120 / 800 = 15%. Compare this with an appropriate WACC."],
["Revenue Quality","Check organic growth, deferred revenue, contract terms, customer concentration, returns and receivables.","Sales rise rapidly but days sales outstanding also rises sharply. Best next step?",["Assume earnings are fraudulent","Inspect receivables aging and revenue recognition","Ignore cash collections"],1,"Slower collections can signal customer stress, changing terms or aggressive recognition; investigate before concluding."],
["Earnings Quality","Reconcile net income with cash flow, accruals, nonrecurring items and stock-based compensation.","Net income grows 30% while operating cash flow falls. What should you do?",["Reconcile accruals and working capital","Buy immediately","Assume the company is insolvent"],0,"Earnings-to-cash divergence is a clue requiring a reconciliation, not automatic proof of misconduct."],
["Forensic Accounting","Inspect footnotes, reserves, capitalization policies, related parties, contingencies and auditor commentary.","Management extends useful asset lives, reducing annual depreciation. Immediate effect?",["Lower reported earnings","Higher reported earnings, all else equal","Higher operating cash receipts"],1,"Lower depreciation increases accounting income without itself creating cash."],
["Capital Allocation","Study buybacks, dilution, dividends, acquisitions, reinvestment and incremental ROIC.","A company repurchases shares at prices far above intrinsic value. Likely consequence?",["Always creates value","No economic effect","Can destroy per-share shareholder value"],2,"The price paid for repurchases matters; capital allocation should be assessed against alternatives."],
["Competitive Position","Compare peers and investigate pricing power, switching costs, customer retention and industry structure.","Two firms have equal margins, but one needs twice the reinvestment for the same growth. Which question matters?",["Which has better incremental returns on capital?","Which has a nicer logo?","Which reports more adjusted metrics?"],0,"Capital efficiency determines how much growth translates into distributable cash."],
["Forecasting","Build integrated three-statement forecasts using sales drivers, margins, working capital, CapEx and debt.","Revenue rises 20%, but receivables rise 50%. Your forecast should:",["Keep working capital fixed","Model the cash consumed by receivables","Ignore the balance sheet"],1,"Revenue and working capital assumptions must reconcile to cash flow."],
["Valuation and Thesis","Forecast cash flows, discount them, test assumptions, compare peers and state disconfirming evidence.","Which is the most defensible investment conclusion?",["One precise fair value with no uncertainty","Buy whenever earnings grow","A valuation range, key assumptions and thesis-breakers"],2,"Valuation is conditional. Ranges, sensitivities and explicit falsification criteria help avoid false precision."]
];
const key="financial-detective-mobile-v2";let state={passed:{},xp:0,notes:"",answers:{}};try{state={...state,...JSON.parse(localStorage.getItem(key)||"{}")}}catch(e){}const app=document.getElementById("app");function save(){try{localStorage.setItem(key,JSON.stringify(state));document.getElementById("status")?.replaceChildren(document.createTextNode("Saved on this device"))}catch(e){document.getElementById("status")?.replaceChildren(document.createTextNode("Private mode may prevent saving"))}stats()}function stats(){let n=Object.values(state.passed).filter(Boolean).length;document.getElementById("xp").textContent=state.xp+" XP";document.getElementById("count").textContent=n+" / 12 missions";document.getElementById("progress").style.width=n/12*100+"%";document.getElementById("rank").textContent=n===12?"Chief Investigator":n>=8?"Senior Analyst":n>=4?"Financial Analyst":"Rookie Analyst"}function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function add(parent,tag,text,cls){const e=el(tag,text,cls);parent.appendChild(e);return e}function btn(parent,text,fn,cls){const b=add(parent,"button",text,cls);b.onclick=fn;return b}function home(){app.replaceChildren();let c=add(app,"section",undefined,"card");add(c,"h2","Academy Missions");add(c,"p","Study each topic, answer the challenge, and revisit mistakes. Correct first-time completions earn 75 XP.","muted");let next=missions.findIndex((_,i)=>!state.passed[i]);btn(c,next<0?"Review completed missions":"▶ Continue Training — Mission "+(next+1),()=>mission(next<0?0:next),"primary");missions.forEach((m,i)=>btn(app,(state.passed[i]?"✓ ":"◇ ")+(i+1)+". "+m[0],()=>mission(i)))}function mission(i){app.replaceChildren();const m=missions[i],c=add(app,"section",undefined,"card");add(c,"span","MISSION "+(i+1)+" OF 12","tag");add(c,"h2",m[0]);add(c,"p",m[1]);add(c,"h3","Decision challenge");add(c,"p",m[2]);const opts=add(c,"div");m[3].forEach((o,j)=>btn(opts,String.fromCharCode(65+j)+". "+o,()=>{Array.from(opts.children).forEach((b,k)=>{b.disabled=true;if(k===m[4])b.classList.add("correct");else if(k===j)b.classList.add("wrong")});const right=j===m[4];if(right&&!state.passed[i]){state.passed[i]=true;state.xp+=75}save();add(c,"h3",right?"✓ Correct":"Not quite");add(c,"p",m[5]);btn(c,"Try this question again",()=>mission(i));btn(c,i===11?"Return to Academy":"Next mission →",()=>i===11?home():mission(i+1),"primary")}));btn(c,"← Back to Academy",home)}function caseFile(){app.replaceChildren();let c=add(app,"section",undefined,"card");add(c,"h2","Case file: Meridian Components");add(c,"p","A fictional industrial supplier. Figures in USD millions; FY2025.");const rows=[["Revenue",1000],["COGS",620],["Operating expenses",180],["Operating profit",200],["Net income",144],["Total assets",1500],["Total liabilities",900],["Equity",600],["Operating cash flow",210],["CapEx",60]];rows.forEach(r=>add(c,"p",r[0]+": $"+r[1]+"M"));add(c,"h3","Investigation prompts");add(c,"p","Calculate gross margin, operating margin, net margin, liabilities-to-equity and free cash flow. Then explain what each metric cannot tell you.");btn(c,"Open investigation journal",notes,"primary")}function notes(){app.replaceChildren();let c=add(app,"section",undefined,"card");add(c,"h2","Investigation journal");add(c,"p","Record hypotheses, evidence, alternative explanations, valuation assumptions and thesis-breakers.");const t=add(c,"textarea");t.placeholder="What does the evidence suggest? What could disprove your conclusion?";t.value=state.notes;btn(c,"Save journal",()=>{state.notes=t.value;save()},"primary");add(c,"p","",undefined).id="status";btn(c,"Return to Academy",home)}stats();home();
</script></body></html>

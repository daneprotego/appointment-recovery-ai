<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LocalVideoAI">
<title>LocalVideoAI</title>
<style>
:root{color-scheme:dark;--bg:#020617;--panel:#0f172a;--panel2:#111827;--text:#e2e8f0;--muted:#94a3b8;--border:#1e293b;--accent:#0ea5e9;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#020617,#0b1120);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.app{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}h1{margin:0 0 4px}p{color:var(--muted)}.card{background:rgba(15,23,42,.94);border:1px solid var(--border);border-radius:18px;padding:16px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}textarea,select,input[type=file],input[type=number]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit}textarea{min-height:74px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button,button{border-radius:12px;padding:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font:inherit}.seg button.active,.primary{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:white}.danger{background:rgba(239,68,68,.16);color:#fecaca}.preview{min-height:200px;border:1px dashed #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted)}.preview img,.preview video,.preview canvas{max-width:100%;max-height:100%}.progress{height:12px;background:#111827;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#38bdf8)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.log{white-space:pre-wrap;background:#020617;border:1px solid var(--border);border-radius:12px;padding:10px;max-height:180px;overflow:auto;color:#d1fae5}.badge{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #1d4ed8;background:rgba(29,78,216,.15);color:#bfdbfe;font-size:.8rem}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>LocalVideoAI</h1>
<p>Phone-only local image→video and video→video PWA.</p>
<div class="card">
<div class="badge" id="engine">Local Browser Engine</div>
<div class="field"><label>Mode</label><div class="seg"><button id="i2v" class="active">Image → Video</button><button id="v2v">Video → Video</button></div></div>
<div class="field"><label>Source media</label><input id="file" type="file" accept="image/*,video/*"><div id="source" class="preview">No media selected</div></div>
<div class="field"><label>Prompt</label><textarea id="prompt" placeholder="Describe motion or transformation..."></textarea></div>
<div class="field"><label>Negative prompt</label><textarea id="negative" placeholder="Things to avoid..."></textarea></div>
<div class="row">
<div class="field"><label>Duration <span id="durLabel">5</span>s</label><input id="duration" type="range" min="1" max="20" value="5"></div>
<div class="field"><label>Aspect ratio</label><select id="aspect"><option>21:9</option><option>16:9</option><option>1:1</option><option>9:16</option></select></div>
</div>
<div class="row">
<div class="field"><label>Quality</label><select id="quality"><option value="draft">Draft</option><option value="standard" selected>Standard</option><option value="high">High</option></select></div>
<div class="field"><label>AI FPS</label><select id="genfps"><option>6</option><option selected>8</option><option>12</option></select></div>
</div>
<div class="row">
<div class="field"><label>Transform strength <span id="tsLabel">45</span>%</label><input id="ts" type="range" min="0" max="100" value="45"></div>
<div class="field"><label>Motion strength <span id="msLabel">50</span>%</label><input id="ms" type="range" min="0" max="100" value="50"></div>
</div>
<div class="actions"><button id="go" class="primary">Generate</button><button id="stop" class="danger" disabled>Stop</button></div>
</div>

<div class="card">
<div class="meta"><span id="status">Idle</span><span id="chunk">No active job</span></div>
<div class="progress"><div id="bar"></div></div>
<pre id="log" class="log">Ready.</pre>
</div>

<div class="card">
<h2>Result</h2>
<div id="result" class="preview">No result yet</div>
<div class="actions"><button id="save" disabled>Save File</button><button id="share" disabled>Share</button></div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
let mode="imageToVideo",file=null,resultBlob=null,abort=false;

$("#i2v").onclick=()=>{mode="imageToVideo";$("#i2v").classList.add("active");$("#v2v").classList.remove("active")};
$("#v2v").onclick=()=>{mode="videoToVideo";$("#v2v").classList.add("active");$("#i2v").classList.remove("active")};
$("#duration").oninput=e=>$("#durLabel").textContent=e.target.value;
$("#ts").oninput=e=>$("#tsLabel").textContent=e.target.value;
$("#ms").oninput=e=>$("#msLabel").textContent=e.target.value;
$("#file").onchange=e=>{file=e.target.files[0];showSource()};
$("#stop").onclick=()=>abort=true;
$("#save").onclick=()=>{if(!resultBlob)return;const u=URL.createObjectURL(resultBlob),a=document.createElement("a");a.href=u;a.download=resultBlob.type.includes("mp4")?"localvideoai.mp4":"localvideoai.webm";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$("#share").onclick=async()=>{if(!resultBlob)return;const ext=resultBlob.type.includes("mp4")?"mp4":"webm",f=new File([resultBlob],"localvideoai."+ext,{type:resultBlob.type||"video/webm"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"LocalVideoAI Output"});else alert("Use Save File.")};
$("#go").onclick=generate;

function log(x){$("#log").textContent+="\n"+x;$("#log").scrollTop=$("#log").scrollHeight}
function setBusy(v){$("#go").disabled=v;$("#stop").disabled=!v;$("#file").disabled=v}
function showSource(){const root=$("#source");root.innerHTML="";if(!file){root.textContent="No media selected";return}const u=URL.createObjectURL(file);if(file.type.startsWith("video/")){const v=document.createElement("video");v.controls=true;v.playsInline=true;v.src=u;root.append(v)}else{const i=document.createElement("img");i.src=u;root.append(i)}}
function dims(ar,q){const P={draft:{"21:9":[640,272],"16:9":[640,360],"1:1":[512,512],"9:16":[360,640]},standard:{"21:9":[768,320],"16:9":[768,432],"1:1":[640,640],"9:16":[432,768]},high:{"21:9":[960,416],"16:9":[960,540],"1:1":[768,768],"9:16":[540,960]}};const d=P[q][ar];return{w:d[0],h:d[1]}}
function flags(p){p=(p||"").toLowerCase();return{noir:/noir|black and white|grayscale/.test(p),neon:/neon|cyberpunk|futuristic|spaceship/.test(p),warm:/warm|golden/.test(p),cool:/cool|blue/.test(p),dream:/dream|dreamy|soft/.test(p),snow:/snow|winter/.test(p),rotate:/spin|rotate/.test(p),shake:/handheld|shake/.test(p)}}
function style(ctx,w,h,f,t,str){if(f.neon){ctx.fillStyle="rgba(0,255,255,"+(0.03+str*0.08)+")";ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(255,0,255,"+(0.15+str*.2)+")";for(let y=0;y<h;y+=24){ctx.beginPath();ctx.moveTo(0,y+(t*2)%12);ctx.lineTo(w,y+(t*2)%12);ctx.stroke()}}if(f.warm){ctx.fillStyle="rgba(255,166,0,"+(0.05+str*.12)+")";ctx.fillRect(0,0,w,h)}if(f.cool){ctx.fillStyle="rgba(30,100,255,"+(0.05+str*.12)+")";ctx.fillRect(0,0,w,h)}if(f.snow){ctx.fillStyle="rgba(255,255,255,.8)";for(let i=0;i<40;i++){let x=((i*53)+t*4)%w,y=((i*89)+t*7)%h;ctx.beginPath();ctx.arc(x,y,1+i%3,0,Math.PI*2);ctx.fill()}}}
function makeImageFrame(img,w,h,i,n,m,p){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),f=flags(p),t=n<=1?0:i/(n-1),z=1+m*.18*t,sw=img.width,sh=img.height,sar=sw/sh,tar=w/h;let cw,ch;if(sar>tar){ch=sh;cw=sh*tar/z}else{cw=sw;ch=sw/tar/z}const mx=Math.max(0,sw-cw),my=Math.max(0,sh-ch),sx=mx*(.5+.3*Math.sin(t*Math.PI)),sy=my*(.5+.2*Math.cos(t*Math.PI));x.save();x.translate(w/2,h/2);if(f.rotate)x.rotate((t-.5)*.08);x.translate(-w/2,-h/2);x.drawImage(img,sx,sy,cw,ch,0,0,w,h);x.restore();if(f.noir){x.filter="grayscale(1) contrast("+(1+m*.8)+")";x.drawImage(c,0,0);x.filter="none"}style(x,w,h,f,i,m);return c}
function makeVideoFrame(src,w,h,i,n,s,p,prev){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),f=flags(p);x.filter=f.noir?"grayscale(1) contrast("+(1+s*.7)+")":f.neon?"saturate("+(1+s*.7)+") hue-rotate(18deg)":"contrast("+(1+s*.2)+") saturate("+(1+s*.2)+")";x.drawImage(src,0,0,src.width,src.height,0,0,w,h);x.filter="none";if(prev){x.globalAlpha=.06+s*.08;x.drawImage(prev,0,0,w,h);x.globalAlpha=1}style(x,w,h,f,i,s);return c}
async function loadImage(f){const u=URL.createObjectURL(f),i=new Image();await new Promise((r,j)=>{i.onload=r;i.onerror=j;i.src=u});return i}
async function extractVideo(f,fps,dur){const u=URL.createObjectURL(f),v=document.createElement("video");v.src=u;v.muted=true;v.playsInline=true;await new Promise(r=>v.onloadedmetadata=r);const d=Math.min(v.duration||0,dur),n=Math.max(1,Math.ceil(d*fps)),out=[];for(let i=0;i<n;i++){await new Promise(r=>{v.onseeked=()=>r();v.currentTime=Math.min(d,i/fps)});const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);out.push(c);if(abort)throw new Error("STOP")}URL.revokeObjectURL(u);return out}
async function exportVideo(frames,fps){const c=document.createElement("canvas");c.width=frames[0].width;c.height=frames[0].height;const x=c.getContext("2d"),stream=c.captureStream(fps),types=["video/mp4;codecs=h264","video/mp4","video/webm;codecs=vp9","video/webm"],type=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"",rec=new MediaRecorder(stream,type?{mimeType:type}:undefined),parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};const done=new Promise(r=>rec.onstop=()=>r(new Blob(parts,{type:rec.mimeType||"video/webm"})));rec.start();for(const f of frames){x.clearRect(0,0,c.width,c.height);x.drawImage(f,0,0);await new Promise(r=>setTimeout(r,1000/fps))}rec.stop();return await done}
async function generate(){if(!file)return alert("Choose media first.");if(mode==="imageToVideo"&&!file.type.startsWith("image/"))return alert("Choose an image.");if(mode==="videoToVideo"&&!file.type.startsWith("video/"))return alert("Choose a video.");abort=false;setBusy(true);$("#log").textContent="Ready.";$("#result").textContent="Working...";try{const dur=+$("#duration").value,fps=+$("#genfps").value,ar=$("#aspect").value,q=$("#quality").value,p=$("#prompt").value,m=+$("#ms").value/100,s=+$("#ts").value/100,{w,h}=dims(ar,q),n=Math.max(1,Math.ceil(dur*fps));let frames=[];if(mode==="imageToVideo"){const img=await loadImage(file);for(let i=0;i<n;i++){if(abort)throw new Error("STOP");frames.push(makeImageFrame(img,w,h,i,n,m,p));$("#bar").style.width=((i+1)/n*100)+"%";$("#status").textContent="Generating image→video";$("#chunk").textContent=(i+1)+"/"+n;await new Promise(r=>setTimeout(r,0))}}else{const src=await extractVideo(file,fps,dur);let prev=null;for(let i=0;i<src.length;i++){if(abort)throw new Error("STOP");prev=makeVideoFrame(src[i],w,h,i,src.length,s,p,prev);frames.push(prev);$("#bar").style.width=((i+1)/src.length*100)+"%";$("#status").textContent="Generating video→video";$("#chunk").textContent=(i+1)+"/"+src.length;await new Promise(r=>setTimeout(r,0))}}log("Generated "+frames.length+" frames locally.");$("#status").textContent="Exporting";resultBlob=await exportVideo(frames,fps);const u=URL.createObjectURL(resultBlob);$("#result").innerHTML="";const v=document.createElement("video");v.controls=true;v.playsInline=true;v.src=u;$("#result").append(v);$("#save").disabled=false;$("#share").disabled=false;$("#status").textContent="Done";$("#bar").style.width="100%";log("Finished. "+(resultBlob.size/1048576).toFixed(2)+" MB.")}catch(e){if(e.message==="STOP"){log("Stopped.");$("#status").textContent="Stopped"}else{log("Error: "+e.message);$("#status").textContent="Error"}}finally{setBusy(false)}}
$("#engine").textContent=("gpu" in navigator)?"Local Browser Engine • WebGPU available":"Local Browser Engine";
</script>
</body></html>
